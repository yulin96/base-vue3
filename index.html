<!doctype html>
<html lang="zh-CN" class="cover">
  <head>
    <meta charset="UTF-8" />

    <meta name="color-scheme" content="light only" />
    <meta name="supported-color-schemes" content="light" />

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <link rel="icon" href="%VITE_APP_SHARE_IMGURL%" />

    <meta name="author" content="%VITE_APP_AUTHOR%" />
    <meta name="contact" content="%VITE_APP_CONTACT%" />
    <meta name="keywords" content="%VITE_APP_TITLE%, %VITE_APP_AUTHOR%, %VITE_APP_CONTACT%" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0,user-scalable=no,minimal-ui,viewport-fit=cover"
    />

    <link rel="dns-prefetch" href="%VITE_APP_API_URL%" />

    <title>%VITE_APP_TITLE%</title>
    <!-- baiduTongji -->

    <!-- <script src="https://oss.eventnet.cn/H5/zz/public/vConsole.js"></script>
    <script>
      new window.VConsole()
    </script> -->
  </head>
  <body>
    <div id="app">
      <style>
        @keyframes loading-in {
          0% {
            opacity: 0;
            transform: scale(0);
          }
          100% {
            opacity: 1;
            transform: scale(1);
          }
        }
        @keyframes init-spin {
          0% {
            transform: rotate(0deg);
          }
          100% {
            transform: rotate(360deg);
          }
        }
      </style>
      <div
        style="
          position: fixed;
          top: 0;
          left: 0;
          width: 100vw;
          height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          z-index: 9999;
          opacity: 0;
          animation: loading-in 0.36s ease forwards 0.6s;
        "
      >
        <div
          style="
            width: 60px;
            height: 60px;
            border: 6px solid #f3f3f3;
            border-top: 6px solid #999;
            border-radius: 50%;
            animation: init-spin 1s linear infinite;
          "
        ></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
