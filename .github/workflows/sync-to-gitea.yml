name: Mirror to Gitea

on:
  push:
    branches:
      - main

jobs:
  mirror_to_gitea:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror Action
        uses: wearerequired/git-mirror-action@v1
        env:
          GIT_ACCESS_TOKEN: ${{ secrets.GITEA_TOKEN_WORK }}
        with:
          source-repo: 'https://github.com/${{ github.repository }}.git'
          destination-repo: 'https://oauth2:${{ secrets.GITEA_TOKEN_WORK }}@gitea.eventnet.cn/yulin/base-vue3.git'
